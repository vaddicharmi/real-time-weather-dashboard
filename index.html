```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌦️ Real-Time Weather Dashboard</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weatherData" class="weather-card">

            <h2 id="cityName">Search for a city</h2>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h3 id="temperature">-- °C</h3>

            <p id="condition">Weather condition</p>

            <div class="details">

                <div>
                    <h4>💧 Humidity</h4>
                    <p id="humidity">-- %</p>
                </div>

                <div>
                    <h4>💨 Wind Speed</h4>
                    <p id="wind">-- km/h</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
